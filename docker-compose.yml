services:
  db:
    image: postgres:16-alpine
    container_name: apitofut-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apitofut
      POSTGRES_USER: apitofut
      POSTGRES_PASSWORD: apitofut_dev
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # tudo em ./db roda na PRIMEIRA subida, em ordem alfabética
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apitofut -d apitofut"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: apitofut-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
