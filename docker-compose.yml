services:
  db:
    image: postgres:18-alpine
    container_name: apitofut-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apitofut
      POSTGRES_USER: apitofut
      # Sobrescreva por ambiente; o padrão só serve para desenvolvimento local.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apitofut_dev}
      TZ: America/Sao_Paulo
      # Senha do papel da aplicação (db/10-senha-app.sh a aplica no init).
      APITOFUT_APP_PASSWORD: ${APITOFUT_APP_PASSWORD:-apitofut_app_dev}
    ports:
      # 5433 no host: a 5432 já é do Postgres.app nativo desta máquina.
      # Dentro da rede do compose o Adminer segue falando com db:5432.
      - "5433:5432"
    volumes:
      # PG 18+: o volume vai na raiz; a imagem cria subpasta por versão
      # (/var/lib/postgresql/18/docker). Ver docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
      # tudo em ./db roda na PRIMEIRA subida, em ordem alfabética
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apitofut -d apitofut"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: apitofut-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
